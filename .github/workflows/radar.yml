name: Radar de Voos (coleta diaria)

on:
  schedule:
    - cron: "15 12 * * *"   # todo dia as 09:15 (Brasilia)
    - cron: "40 21 * * *"   # reserva 18:40 (Brasilia): so coleta se a das 09:15 nao rodou
  workflow_dispatch:         # botao "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency: radar

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar precos (SerpApi)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LIMITE_MENSAL: ${{ vars.LIMITE_MENSAL || '120' }}
          POR_RODADA: ${{ vars.POR_RODADA || '3' }}
        run: python radar_extra.py ${{ github.event_name == 'schedule' && '--se-preciso' || '' }}
      - name: Guardar historico no repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add historico.csv estado.json precos-extra.json alertas.json
          git diff --cached --quiet || git commit -m "coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs || git pull --rebase
          git push
